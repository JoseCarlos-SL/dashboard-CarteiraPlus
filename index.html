<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteira+</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icons/carteira.png">
</head>

<body>
    <header>
        <div class="box-icone-header">
            <img src="icons/carteira-header.png" alt="" class="icone-header">
        </div>
        <div class="box-texto-header">
            <h1>Carteira +</h1>
            <p>Seu dashboard financeiro</p>
        </div>
    </header>
    <main>
        <section class="principais-informacoes">

            <article id="saldo-atual" class="card">
                <div class="card-texto">
                    <h2>Saldo Atual</h2>
                    <p>R$ 1.000,00</p>
                </div>
                <div class="box-icone">
                    <img class="icone" src="icons/carteira.png" alt="">
                </div>
            </article>

            <article id="total-de-entradas" class="card">
                <div class="card-texto">
                    <h2>Total de Entradas</h2>
                    <p>R$ 1.000,00</p>
                </div>
                <div class="box-icone">
                    <img class="icone" src="icons/aumentar.png" alt="">
                </div>
            </article>
            <article id="total-de-dividas" class="card">
                <div class="card-texto">
                    <h2>Total de Dívidas</h2>
                    <p>R$ 1.000,00</p>
                </div>
                <div class="box-icone">
                    <img class="icone" src="icons/diminuir.png" alt="">
                </div>
            </article>
            <article id="proxima-parcela" class="card">
                <div class="card-texto">
                    <h2>Próxima Parcela</h2>
                    <p>R$ 1.000,00</p>
                </div>
                <div class="box-icone">
                    <img class="icone" src="icons/calendario.png" alt="">
                </div>
            </article>

        </section>
        <section class="entradas">
            <article class="painel">
                <div class="texto-painel">
                    <h3>Entradas</h3>
                    <p>2 registro(s)</p>
                </div>
                 <button class="nova">+ Nova</button>
                
                <div class="box-geral">
                    <h4>Salário mensal</h4>
                </div>
                <div class="box-geral">
                    <h4>Projeto freelancer</h4>
                </div>
            </article>
        </section>
        <section class="dividas">
            <article class="painel">
                <h3>Entradas</h3> <button class="nova">
                    <p>+ Nova</p>
                </button>
                <p>2 dívida(s) ativa(s)</p>
                <div class="box-geral">
                    <h4>Celular parcelado</h4>
                </div>
                <div class="box-geral">
                    <h4>Notebook parcelado</h4>
                </div>
            </article>
        </section>
        <section class="grafico-de-dividas">
            <article class="painel"></article>
        </section>

    </main>
    <footer>

    </footer>
</body>

</html>
