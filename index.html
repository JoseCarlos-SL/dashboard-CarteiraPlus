<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteira+</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icons/carteira.png">
</head>

<body>
    <header>
        <div class="box-icone-header">
            <img src="icons/carteira-header.png" alt="" class="icone-header">
        </div>
        <div class="box-texto-header">
            <h1>Carteira +</h1>
            <p>Seu dashboard financeiro</p>
        </div>
    </header>

    <div id="modal" class="modal">
    <div class="modal-conteudo">

        <button id="fechar-modal" class="fechar-modal">×</button>

        <h2>Nova movimentação</h2>

        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Ex: Salário">

        <label for="valor">Valor</label>
        <input type="number" id="valor" placeholder="Ex: 1500">

        </select>

        <button id="adicionar">Adicionar</button>

    </div>
</div>
    <main>
        <section class="principais-informacoes">

            <article id="saldo-atual" class="card">
                <div class="card-texto">
                    <h2>Saldo Atual</h2>
                    <p id="valor-total-de-saldo"></p>
                </div>
                <div class="box-icone">
                    <img class="icone" src="icons/carteira.png" alt="">
                </div>
            </article>

            <article id="total-de-entradas" class="card">
                <div class="card-texto">
                    <h2>Total de Entradas</h2>
                    <p id="valor-total-de-entradas"></p>
                </div>
                <div class="box-icone">
                    <img class="icone" src="icons/aumentar.png" alt="">
                </div>
            </article>
            <article id="total-de-dividas" class="card">
                <div class="card-texto">
                    <h2>Total de Dívidas</h2>
                    <p id="dividas"></p>
                </div>
                <div class="box-icone">
                    <img class="icone" src="icons/diminuir.png" alt="">
                </div>
            </article>
            <article id="proxima-parcela" class="card">
                <div class="card-texto">
                    <h2>Próxima Parcela</h2>
                    <p id="pParcela"></p>
                </div>
                <div class="box-icone">
                    <img class="icone" src="icons/calendario.png" alt="">
                </div>
            </article>

        </section>
<!-- ---------------------Entradas---------------------       -->
        <section class="entradas">
            <article class="painel">
                <div class="box-cima-painel">
                    <div class="texto-painel">
                        <h3>Entradas</h3>
                        <p class=""></p>
                    </div>
                    <button class="nova">+ Nova</button>
                </div>
            </article>
        </section>
<!-- ---------------------Entradas---------------------       -->
<!-- ---------------------dividas---------------------       -->
       <section class="dividsa">
            <article class="painel">
                <div class="box-cima-painel">
                    <div class="texto-painel">
                        <h3>Entradas</h3>
                        <p class=""></p>
                    </div>
                    <button class="nova">+ Nova</button>
                </div>
            </article>
        </section>
<!-- ---------------------Entradas---------------------       -->

    </main>
    <footer>

    </footer>
    <script src="script.js" ></script>
</body>

</html>
